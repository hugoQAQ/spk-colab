_BASE_: "Base-RCNN-FPN.yaml"
MODEL:
  META_ARCHITECTURE: "FXGeneralizedRCNN"
  WEIGHTS: "/home/hew/fasterrcnn-finetune/model_final_vanilla_resnet_bdd.pth"
  MASK_ON: False
  RESNETS:
    DEPTH: 50
  ROI_HEADS:
    NAME: "StandardROIHeads"
    NUM_CLASSES: 10
INPUT:
  MIN_SIZE_TRAIN: (480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800)
  MIN_SIZE_TEST: 800
DATASETS:
  TRAIN: ('bdd_custom_train',)
  TEST: ('bdd_custom_val',)
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.02
  STEPS: (12000, 16000)
  MAX_ITER: 18000
  WARMUP_ITERS: 100
DATALOADER:
    NUM_WORKERS: 8
